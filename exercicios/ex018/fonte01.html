<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fontes com google fontes</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Playwrite+HU:wght@100..400&display=swap");

      @import url("https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap");
      body {
        font: 16px "work sans", serif;
      }
      h1 {
        font: playwrite HU, sans serif;
        color: blue;
      }
    </style>
  </head>
  <body>
    <h1>Título</h1>
    <p>
      Lorem, ipsum dolor sit amet consectetur adipisicing elit. Ad recusandae
      obcaecati possimus! Itaque magnam mollitia culpa temporibus, impedit omnis
      commodi qui aspernatur est quia odio dolorum similique unde at aliquid!
    </p>
  </body>
</html>
