<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
           width: 500px;
           height: 150px;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 5px;
        }
        thead, tfoot {
            background-color: gray;
            color: white;
        }
        .num {
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <!-- Anatomia de tabelas grandes
     TABLE
        THEAD
            TR, TD, TH
        TBODY
            TR, TD, TH
        TFOOT
            TR, TD, TH
    -->
    <table>
        <thead>
            <tr>
                <th>Posição</th>
                <th>estado</th>
                <th>população</th>
                <th>porcentagem</th>
            </tr>
        </thead>
        <tbody>
             <tr>
                <td>1</td>
                <td>São Paulo</td>
                <td class="num">45.919.043</td>
                <td>7,63%</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Minas Gerais</td>
                <td class="num">21.393.441</td>
                <td>4,81%</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Rio de Janeiro</td>
                <td class="num">17.223.547</td>
                <td>0,41%</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>Total</th>
                <td>Brasil</td>
                <td class="num">84.536.031</td>
                <td>12,85%</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
