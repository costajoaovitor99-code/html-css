<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Links</title>
    <style>
      /*
        # = ID
        . = CLASS
        : = PSEUDO-CLASS
        :: = PSEUDO-ELEMENT
        > = FILHO
        */
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-image: linear-gradient(
          to left,
          rgba(147, 201, 45, 0.586),
          rgb(150, 178, 12),
          rgb(211, 237, 126)
        );
      }
      a {
        color: brown;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
        color: black;
      }
      a:visited {
        color: blueviolet;
      }
      a:active {
        color: gold;
      }
    </style>
  </head>
  <body>
    <h1>Personalizando links</h1>
    <ul>
      <li>
        <a href="https://gustavoguanabara.github.io" target="_blank"
          >Repositório GitHub</a
        >
      </li>
      <li>
        <a href="https://youtube.com/cursoemvideo/" target="_blank"
          >Canal do you tube</a
        >
      </li>
      <li>
        <a href="https://www.cursoemvideo.com" target="_blank"
          >Site do cursoemvídeo</a
        >
      </li>
    </ul>
  </body>
</html>
