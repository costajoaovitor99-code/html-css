<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo de Hover</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
       
        }
        div > p{
            display: none;/*Texto não aparecerá*/
        }
        div:hover > p{
            display: block;/* Texto aparecerá quando o mouse passar*/
            background-color: aqua;
            color: black;
            width: 130px;
        }
        div:hover{
            color: aqua;
        }
    </style>
  </head>
  <body>
    <h1>Exemplo de hover</h1>
    <p>Passe o mouse sobre o texto abaixo</p>
    <div>
      Passe o mouse aqui
      <p>Texto escondido</p>
    </div>
  </body>
</html>
