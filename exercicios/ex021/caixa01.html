<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modelo de caixas</title>
    <style>
      h1 {/*Box-level*/
        background-color: rgb(145, 181, 188);
        width: 250px;
        height: 80px;
        color: blue;

        border: 10px solid rgb(80, 181, 214);

        padding: 10px;

        margin: auto;

        outline: 5px dashed blue;
        }
      
      a {/*inline-level*/
        color: brown;
        border-width: 5px;
        border-style: groove;
        border-color: brown;
      }
    </style>
  </head>
  <body>
    <h1>Exemplo de caixa box-level</h1>
    <p>
      Parágrafos também são exemplos de box-level, mas os
      <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como
      isso funciona.
    </p>
  </body>
</html>
